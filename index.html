<h1>Clay Health</h1>
<p>Clay Health is a personal, single-user tool. It reads the owner's own Fitbit data through the Google Health API to produce a private weekly summary of sleep, activity and heart rate for that same person.</p>
<p>It is not offered to anyone else. <a href="privacy.html">Privacy policy</a></p>
